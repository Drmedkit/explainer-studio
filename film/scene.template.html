<!doctype html>
<html lang="en" data-film="{{THEME}}"><head><meta charset="utf-8"><title>{{TITLE}} film scene</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,400&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 1920×1080 film frame (explainer-studio): the figure fills the frame FULL-BLEED and its own camera directs the eye; no card,
   no card corners, no legend, no card captions; overlays stay small and at the edges. Light theme by default. */
:root { --bg: #0b0b0c; --ink: #ececec; --text: #b4b4ba; --muted: #74747b; --accent: {{ACCENT_DARK}}; --panel: #101012f2; --edge: #2a2a2e; --veil: #0b0b0ccc; --shadow: #000;
  --f-display: "Newsreader", Georgia, serif; --f-body: "Atkinson Hyperlegible", system-ui, sans-serif; --f-mono: "JetBrains Mono", Consolas, monospace; }
html[data-film="light"] { --bg: #f3f3f0; --ink: #18181a; --text: #4a4a50; --muted: #7a7a80; --accent: {{ACCENT}}; --panel: #fbfbfaf2; --edge: #dcdcd8; --veil: #f3f3f0e6; --shadow: #fff; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--f-body); }
#figBox { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#figBox > * { width: 1920px; }
#figBox .iso-figure { margin: 0 !important; padding: 0 !important; }
#figBox .iso-plate { padding: 0 !important; margin: 0 !important; box-shadow: none !important; background: transparent !important; border: 0 !important; outline: none !important; border-radius: 0 !important; }
#figBox .iso-plate-corners, #figBox [data-corner] { display: none !important; }
#figBox [data-stage] { width: 1920px !important; height: 1080px !important; margin: 0 !important; }
#figBox [data-stage]:focus, #figBox [data-stage]:focus-visible { outline: none !important; }
#figBox figcaption, #figBox .iso-figure ~ p, #figBox .iso-keys, #figBox .iso-legend, #figBox .iso-caption { display: none !important; }
.ov { position: absolute; opacity: 0; }
#label { left: 72px; top: 56px; padding: 14px 18px; background: var(--veil); border-radius: 6px; font: 600 28px/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink); }
#label small { display: block; margin-top: 10px; font: 400 22px/1 var(--f-mono); letter-spacing: .06em; text-transform: none; color: var(--muted); font-variant-numeric: tabular-nums; }
#label small:empty { display: none; }
#readout { right: 56px; top: 56px; display: flex; gap: 28px; text-align: right; padding: 12px 16px; background: var(--veil); border-radius: 6px; }
#readout div { display: flex; flex-direction: column; gap: 6px; min-width: 150px; }
#readout b { font: 600 46px/1 var(--f-mono); color: var(--ink); font-variant-numeric: tabular-nums; }
#readout span { font: 400 16px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
#note { left: 72px; bottom: 190px; max-width: 1060px; font: 400 34px/1.25 var(--f-body); color: var(--ink); padding: 14px 20px; background: var(--veil); border-left: 4px solid var(--accent); border-radius: 4px; }
#pip { right: 56px; top: 190px; width: 620px; box-shadow: 0 10px 40px #0000001f; padding: 18px; background: var(--panel); border: 1px solid var(--edge); border-radius: 12px; }
#pip .pane { display: none; } #pip .pane[data-on] { display: block; }
#pip .lbl { font: 600 16px/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
#sub { position: absolute; left: 0; right: 0; bottom: 0; padding: 26px 240px 40px; text-align: center; background: linear-gradient(to top, var(--veil) 55%, transparent); font: 400 36px/1.3 var(--f-body); color: var(--ink); text-shadow: 0 2px 12px var(--shadow), 0 0 3px var(--shadow), 0 0 1px var(--shadow); }
#sub:empty { display: none; }
#title { inset: 0; display: flex; flex-direction: column; justify-content: center; padding-left: 140px; gap: 22px; background: linear-gradient(to right, var(--veil) 45%, transparent 80%); }
#title .eb, #end .eb { font: 600 22px/1 var(--f-mono); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
#title .big, #end .big { font: 500 128px/1 var(--f-display); color: var(--ink); letter-spacing: -.01em; }
#title em, #end em { font-style: italic; font-weight: 400; color: var(--accent); }
#end { inset: 0; display: flex; flex-direction: column; justify-content: center; padding-left: 140px; gap: 24px; background: var(--veil); }
#end .big { font-size: 96px; max-width: 1500px; }
#end .mid { font: 400 34px/1.35 var(--f-body); color: var(--text); max-width: 1200px; }
</style></head>
<body>
<div id="figBox">{{FIGURE}}</div>
<div class="ov" id="label"><span></span><small></small></div>
<div class="ov" id="readout"></div>
<div class="ov" id="note"></div>
<div class="ov" id="pip"></div>
<div id="sub"></div>
<div class="ov" id="title"><div class="eb">{{EYEBROW}}</div><div class="big">{{TITLE_HTML}}</div></div>
<div class="ov" id="end"><div class="eb">{{END_EYEBROW}}</div><div class="big">{{END_HTML}}</div><div class="mid">{{END_MID}}</div></div>
<script type="module">
{{BUNDLE}}
const WORDS = {{WORDS}};
const FIG_API = {{FIG_API}};
{{RUNTIME}}
</script>
</body></html>
