<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,400&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* explainer-studio page: Watch / Explain / Open lab around one live figure. The figure stays in the left column with its own
   camera; the right column holds the film, the explainer steps or the open lab with its instruments. One accent colour. */
:root {
  --pg-bg: #f2f1ee; --pg-panel: #fbfbf9; --pg-ink: #19191b; --pg-text: #4f4f55; --pg-muted: #77777d; --pg-line: #dcdbd6;
  --pg-good: #2d8a5c; --pg-bad: #c4423f; --pg-chip: #ebeae6; --pg-focus: #3e63dd; --pg-accent: {{ACCENT}};
  --f-display: "Newsreader", "Iowan Old Style", Georgia, serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --pg-bg: #0b0b0c; --pg-panel: #141415; --pg-ink: #ececec; --pg-text: #a7a7ad; --pg-muted: #7d7d84; --pg-line: #27272a;
  --pg-good: #5fd39a; --pg-bad: #ff7a74; --pg-chip: #1d1d20; --pg-focus: #8ab4ff; --pg-accent: {{ACCENT_DARK}}; color-scheme: dark; } }
:root[data-theme="dark"] {
  --pg-bg: #0b0b0c; --pg-panel: #141415; --pg-ink: #ececec; --pg-text: #a7a7ad; --pg-muted: #7d7d84; --pg-line: #27272a;
  --pg-good: #5fd39a; --pg-bad: #ff7a74; --pg-chip: #1d1d20; --pg-focus: #8ab4ff; --pg-accent: {{ACCENT_DARK}}; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--pg-bg); color: var(--pg-text); font: 400 1rem/1.55 var(--f-body); }
:focus-visible { outline: 2px solid var(--pg-focus); outline-offset: 2px; }
.wrap { max-width: 1400px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 56px; display: flex; flex-direction: column; gap: 22px; }
.hero { display: flex; flex-direction: column; gap: 10px; max-width: 64rem; }
.eyebrow { font: 600 .72rem/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--pg-muted); margin: 0; }
.eyebrow b { color: var(--pg-accent); font-weight: 600; }
h1 { margin: 0; font: 500 clamp(2rem, 5.4vw, 3.6rem)/1.04 var(--f-display); color: var(--pg-ink); letter-spacing: -.01em; text-wrap: balance; }
h1 em { font-style: italic; font-weight: 400; }
.lede { margin: 0; max-width: 46rem; font-size: 1.08rem; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--pg-line); }
.tabs button { font: 600 .9rem/1 var(--f-body); color: var(--pg-muted); background: none; border: 0; padding: 12px 14px 13px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; min-height: 44px; }
.tabs button[aria-selected="true"] { color: var(--pg-ink); border-bottom-color: var(--pg-ink); }
.tabs button span { font: 400 .72rem var(--f-mono); color: var(--pg-muted); margin-left: 6px; }
.stage { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.stage[data-tab="watch"] { grid-template-columns: minmax(0, 1fr); }
.stage[data-tab="watch"] .fig-col { display: none; }
.fig-col { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.fig-col figcaption, .fig-col .iso-figure ~ p { display: none; }
/* the figure's camera zooms into regions (explainer steps): clip what lies outside the view to the card */
.fig-col [data-stage], .fig-col [data-stage] svg { overflow: hidden; }
.side-col { min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.panel { background: var(--pg-panel); border: 1px solid var(--pg-line); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.ins { background: var(--pg-panel); border: 1px solid var(--pg-line); border-radius: 10px; padding: 12px; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.ins[hidden] { display: none; }
.ins .cap { font: 600 .7rem/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--pg-muted); }
h2 { margin: 0; font: 500 1.75rem/1.15 var(--f-display); color: var(--pg-ink); text-wrap: balance; }
h3 { margin: 0; font: 700 1rem/1.3 var(--f-body); color: var(--pg-ink); }
.kicker { font: 600 .72rem/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--pg-muted); }
p { margin: 0; }
.q { font-weight: 700; color: var(--pg-ink); }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; font: inherit; color: var(--pg-ink); background: var(--pg-chip); border: 1px solid var(--pg-line); border-radius: 8px; padding: 11px 13px; cursor: pointer; min-height: 44px; }
.opt:hover { border-color: var(--pg-muted); }
.opt[data-state="right"] { border-color: var(--pg-good); box-shadow: inset 4px 0 0 var(--pg-good); }
.opt[data-state="wrong"] { border-color: var(--pg-bad); box-shadow: inset 4px 0 0 var(--pg-bad); }
.opt:disabled { cursor: default; }
.feedback { border-left: 3px solid var(--pg-line); padding-left: 12px; display: flex; flex-direction: column; gap: 8px; }
.feedback .mis { color: var(--pg-bad); font-size: .92rem; }
.feedback .ok { color: var(--pg-good); font-weight: 700; }
.nav { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.btn { font: 700 .92rem/1 var(--f-body); border-radius: 8px; padding: 12px 16px; min-height: 44px; cursor: pointer; border: 1px solid var(--pg-line); background: var(--pg-panel); color: var(--pg-ink); }
.btn.primary { background: var(--pg-ink); color: var(--pg-bg); border-color: var(--pg-ink); }
.btn:disabled { opacity: .45; cursor: default; }
.dots { display: flex; gap: 6px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--pg-line); }
.dots i[data-on] { background: var(--pg-ink); }
.dots i[data-done] { background: var(--pg-good); }
video { width: 100%; max-width: 100%; border-radius: 10px; background: #000; aspect-ratio: 16 / 9; display: block; }
.chapters, .row { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: 600 .8rem/1 var(--f-mono); padding: 9px 11px; border-radius: 99px; border: 1px solid var(--pg-line); background: var(--pg-chip); color: var(--pg-ink); cursor: pointer; min-height: 36px; }
.chip[aria-pressed="true"] { background: var(--pg-ink); color: var(--pg-bg); border-color: var(--pg-ink); }
.ctl { display: flex; flex-direction: column; gap: 6px; }
.ctl label, .ctl .lab { font: 600 .74rem/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--pg-muted); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.ctl output { font: 600 .9rem var(--f-mono); color: var(--pg-ink); letter-spacing: 0; text-transform: none; }
input[type="range"] { width: 100%; accent-color: var(--pg-accent); min-height: 28px; }
.toggles { display: flex; flex-wrap: wrap; gap: 8px; }
.meter { display: grid; grid-template-columns: repeat(auto-fit, minmax(7.5rem, 1fr)); gap: 8px; }
.meter div { background: var(--pg-chip); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.meter b { font: 600 1.15rem/1.1 var(--f-mono); color: var(--pg-ink); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.meter span { font: 400 .7rem/1.2 var(--f-mono); color: var(--pg-muted); text-transform: uppercase; letter-spacing: .06em; }
.meter .warn b { color: var(--pg-bad); }
.meter .good b { color: var(--pg-good); }
.challenge { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--pg-line); padding-top: 12px; }
.challenge[data-done] h3::after { content: "  done"; font: 600 .75rem var(--f-mono); color: var(--pg-good); }
.note { font-size: .88rem; color: var(--pg-muted); }
footer { font-size: .82rem; color: var(--pg-muted); border-top: 1px solid var(--pg-line); padding-top: 14px; max-width: 72rem; }
@media (max-width: 900px) { .stage { grid-template-columns: minmax(0, 1fr); } .fig-col { position: static; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
{{EXTRA_CSS}}
</style>

<div class="wrap" id="app">
  <header class="hero">
    <p class="eyebrow">{{EYEBROW}} · <b id="stateName"></b></p>
    <h1>{{TITLE_HTML}}</h1>
    <p class="lede">{{LEDE}}</p>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button role="tab" id="t-watch" aria-selected="true" data-tab="watch">Watch <span>{{FILM_LEN}}</span></button>
      <button role="tab" id="t-explain" aria-selected="false" data-tab="explain">Explain <span>{{STEPS_N}} steps</span></button>
      <button role="tab" id="t-lab" aria-selected="false" data-tab="lab">Open lab <span>{{CHALLENGES_LABEL}}</span></button>
    </nav>
  </header>

  <main class="stage" id="stage" data-tab="watch">
    <section class="fig-col" aria-label="{{FIG_LABEL}}">
      {{FIGURE}}
    </section>

    <section class="side-col">
      <div id="p-watch" role="tabpanel" aria-labelledby="t-watch">
        <div class="panel">
          <video id="film" controls preload="metadata" playsinline poster="poster.jpg">
            <source src="{{FILM_FILE}}" type="video/mp4">
            <track kind="captions" srclang="en" label="English" id="capTrack" default>
          </video>
          <div class="chapters" id="chapters"></div>
          <p class="note">{{WATCH_NOTE}}</p>
        </div>
      </div>

      <div id="p-explain" role="tabpanel" aria-labelledby="t-explain" hidden>
        <article class="panel" id="stepCard" aria-live="polite"></article>
        <div id="explainIns"></div>
        <div class="nav">
          <button class="btn" id="prev">Back</button>
          <div class="dots" id="dots" aria-hidden="true"></div>
          <button class="btn primary" id="next">Next step</button>
        </div>
      </div>

      <div id="p-lab" role="tabpanel" aria-labelledby="t-lab" hidden>
        <div class="panel" id="labPanel">
          <h2>Open lab</h2>
          {{LAB}}
        </div>
        <div id="labIns"></div>
        <div class="panel" id="challenges"></div>
      </div>
    </section>
  </main>

  <footer>{{FOOTER}}</footer>
</div>

<script type="module">
{{BUNDLE}}
const FIG_API = {{FIG_API}};
const SLUG = {{SLUG}};
const CHAPTERS = {{CHAPTERS}};
{{RUNTIME}}
</script>
